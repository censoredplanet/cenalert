services:
  api:
    build:
      context: .
      dockerfile: rust-detector/Dockerfile.api
    environment:
      CENALERT_DATABASE: /data/current/cenalert.sqlite
    volumes:
      - ${CENALERT_DATA_ROOT:?Set CENALERT_DATA_ROOT to the run_daily output directory}:/data:ro
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5).read()"]
      interval: 15s
      timeout: 6s
      retries: 3
      start_period: 10s
    restart: unless-stopped
  dashboard:
    build:
      context: .
      dockerfile: dashboard/Dockerfile
    ports:
      - "127.0.0.1:${CENALERT_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/api/health"]
      interval: 15s
      timeout: 6s
      retries: 3
      start_period: 10s
    restart: unless-stopped
