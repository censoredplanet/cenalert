[package]
name = "cenalert-detector"
version = "0.1.0"
edition = "2021"
rust-version = "1.97.1"
publish = false

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
rsomics-shapiro = "0.1.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
