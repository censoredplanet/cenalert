[package]
name = "cenalert-detector"
version = "0.1.0"
edition = "2021"
rust-version = "1.97.1"
publish = false

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.6.2", features = ["derive"] }
kneed = "=1.0.0"
levenberg-marquardt = "=0.14.0"
nalgebra = "0.33"
optirustic = "=1.2.2"
rayon = "1.12"
rsomics-shapiro = "0.1.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
